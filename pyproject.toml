[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inochi2d-ai-rigging"
version = "0.1.0"
description = "Inochi2D rigging model inspector and future AI-rigging toolkit"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
inochi-rig = "rigging.cli:main"

[tool.setuptools.packages.find]
include = ["rigging*"]
