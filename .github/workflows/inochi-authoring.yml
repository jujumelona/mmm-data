name: Inochi2D AI Rigging Quality Gates
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[mcp]'
      - run: python -m unittest discover -s native -p 'test_*.py' -v
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm test
      - run: npm run check
      - run: npm run checkout-preview
